openapi: 3.1.0
info:
  title: SMSC Gateway API
  version: 0.1.0-draft
  description: |
    Kontrak REST untuk SMS Gateway (server <-> dashboard <-> sistem eksternal <-> aplikasi Android).
    Realtime ke device memakai WebSocket (lihat `device-ws-protocol.md`), realtime ke dashboard memakai SSE (`/events/stream`).

    Konvensi:
    - Semua waktu RFC 3339 UTC. Semua id adalah UUIDv7 (string).
    - Nomor tujuan dinormalisasi ke E.164 (`+62...`). Input `08xx` diterima dan dikonversi memakai `default_region` (default `ID`).
    - Error memakai RFC 9457 `application/problem+json`.
    - Pagination cursor: `?limit=50&cursor=<opaque>`; respons memuat `next_cursor` (null jika habis).
    - Operasi pembuatan yang berisiko ganda (`POST /messages`, `POST /campaigns`) menerima header `Idempotency-Key`.
    - Semua endpoint dapat membalas `401` (tidak terautentikasi), `403` (peran/scope/CSRF), `429` (rate limit, dengan `Retry-After`) dan `500`, semuanya `application/problem+json`; tidak diulang per operasi.
    - Endpoint tambahan di luar MVP awal: `GET/PUT /settings/dispatch-pause` (kill switch global, spec 09 §8).
servers:
  - url: https://smsc.example-tailnet.ts.net/api/v1
    description: Via Tailscale Serve (HTTPS, MagicDNS)
tags:
  - name: Auth
  - name: Devices
  - name: DeviceAgent
    description: Endpoint yang dipanggil aplikasi Android.
  - name: SIMs
  - name: Messages
    description: Transaksi pengiriman (campaign maupun non-campaign).
  - name: Campaigns
  - name: Templates
  - name: Policies
    description: Manajemen delay, rate limit, jendela waktu, retry.
  - name: Compliance
  - name: Admin
  - name: Webhooks
  - name: Stats
  - name: Realtime

security:
  - sessionCookie: []
  - apiKey: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          description: |
            Dua kemungkinan. Tanpa 2FA: cookie sesi di-set (HttpOnly, Secure, SameSite=Lax) dan badan berisi profil + `csrf_token`.
            Dengan 2FA aktif: **belum ada sesi**; badan berisi `mfa_required: true` + `mfa_token` (berlaku 5 menit) untuk `POST /auth/login/verify`.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Me'}
                  - {$ref: '#/components/schemas/MfaChallenge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '423': {description: 'Akun terkunci sementara (`auth.locked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login/verify:
    post:
      tags: [Auth]
      security: []
      summary: Selesaikan login dengan kode 2FA
      description: |
        `code` = 6 digit TOTP atau satu kode pemulihan (sekali pakai). Kode TOTP yang sama tidak diterima dua kali.
        Salah memasukkan kode dihitung seperti salah password: 5 kali → akun terkunci 15 menit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: {type: string}
                code: {type: string, example: '123456'}
      responses:
        '200':
          description: Cookie sesi di-set; badan = profil + `csrf_token`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {description: 'Kode salah (`auth.invalid_code`) atau tantangan kedaluwarsa (`auth.mfa_expired`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '423': {description: 'Akun terkunci sementara (`auth.locked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/password:
    post:
      tags: [Auth]
      summary: Ganti password sendiri
      description: Hanya sesi dashboard. Semua sesi lain milik pengguna dicabut; sesi saat ini tetap. **Kebijakan password baru** — 12–256 karakter, bukan password umum (daftar ±47 rb entri + variasi sepele seperti `Password123!` / `p@ssw0rd`), bukan pola monoton/berurutan/jalur keyboard/blok berulang, dan tidak memuat nama akun (bagian email sebelum `@`, ≥ 4 huruf). Pelanggaran → 422 dengan pesan berawalan `terlalu lemah`. Password lama tidak dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password, minLength: 12}
      responses:
        '204': {description: Diganti}
        '401': {description: 'Password saat ini salah (`auth.invalid_credentials`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/methods:
    get:
      tags: [Auth]
      security: []
      summary: Metode login yang tersedia (publik, untuk halaman login)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [passkey_login, oidc]
                properties:
                  passkey_login: {type: boolean, description: 'WebAuthn tersedia di server DAN admin mengizinkan login passkey.'}
                  oidc:
                    type: object
                    required: [enabled]
                    properties:
                      enabled: {type: boolean, description: 'SSO OIDC dikonfigurasi (OIDC_ISSUER).'}
                      name: {type: string, description: 'Label tombol, mis. Google Workspace.'}
  /auth/passkey/begin:
    post:
      tags: [Auth]
      security: []
      summary: Mulai login tanpa password dengan passkey
      description: |
        Pengguna belum diketahui (kredensial discoverable); `allowCredentials` kosong dan `userVerification: required`. Mengembalikan
        `ceremony_id` sekali pakai (5 menit) + opsi untuk `navigator.credentials.get()`. Dibatasi laju seperti login.
      responses:
        '200':
          description: Opsi + ceremony
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnBegin'}
        '409': {description: 'Login passkey dinonaktifkan (`passkey.disabled`) / WebAuthn tidak tersedia', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/passkey/finish:
    post:
      tags: [Auth]
      security: []
      summary: Selesaikan login tanpa password dengan passkey
      description: |
        `credential` = hasil `navigator.credentials.get()` termasuk `response.userHandle` (wajib untuk discoverable). Syarat: kredensial
        bertanda passkey, verifikasi pengguna terjadi, akun aktif dan tidak terkunci, sign count tidak mundur. **Tidak ada langkah kedua**
        (passkey = dua faktor). Respons seragam 401 untuk semua kegagalan verifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id, credential]
              properties:
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Cookie sesi di-set; badan = profil + `csrf_token`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {description: 'Upacara tidak valid/kedaluwarsa/terpakai', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '401': {description: 'Verifikasi gagal (`auth.webauthn_failed`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Login passkey dinonaktifkan', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '423': {description: 'Akun terkunci (`auth.locked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/oidc/login:
    get:
      tags: [Auth]
      security: []
      summary: Mulai login SSO (navigasi peramban)
      description: |
        Mengalihkan (302) ke IdP dengan authorization code + PKCE S256 + `state` + `nonce`, dan men-set cookie pengikat `smsc_oidc`
        (HttpOnly, Lax, 10 menit). `next` = path lokal tujuan setelah login (selain path lokal diabaikan → `/`).
        Bila IdP tidak terjangkau: 302 ke `/?sso_error=unavailable`. SSO belum dikonfigurasi → 404 `sso.not_configured`.
      parameters:
        - {name: next, in: query, required: false, schema: {type: string, example: /campaigns}}
      responses:
        '302': {description: 'Menuju IdP', headers: {Location: {schema: {type: string}}}}
        '404': {description: 'SSO belum dikonfigurasi (`sso.not_configured`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/oidc/callback:
    get:
      tags: [Auth]
      security: []
      summary: Callback IdP (redirect_uri)
      description: |
        Selalu membalas 302. Sukses login: cookie sesi di-set dan menuju `next`. Sukses link: `/account?sso=linked`. Gagal: `/?sso_error=<kode>`
        (login) atau `/account?sso_error=<kode>` (link) dengan kode ringkas: `invalid_state` (state tak dikenal/kedaluwarsa/terpakai/binder tak cocok),
        `session_mismatch`, `denied`, `token` (penukaran code / verifikasi id_token / nonce gagal), `unavailable`, `not_linked`, `unverified_email`,
        `domain`, `disabled`, `conflict`, `link_conflict`. Detail hanya di log/audit server.
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '302': {description: Redirect, headers: {Location: {schema: {type: string}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/oidc/link:
    post:
      tags: [Auth]
      summary: Mulai menautkan akun saya ke SSO
      description: Sesi dashboard. Mengembalikan URL IdP (klien menavigasinya) dan men-set cookie pengikat. Identitas = (issuer, sub), bukan email.
      responses:
        '200':
          description: URL otorisasi IdP
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string}
        '404': {description: 'SSO belum dikonfigurasi', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '502': {description: 'IdP tidak terjangkau (`sso.unavailable`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [Auth]
      summary: Lepas tautan SSO akun saya
      description: Ditolak (409 `sso.unlink_blocked`) bila akun tidak punya password — akan terkunci permanen.
      responses:
        '204': {description: Dilepas}
        '409': {description: 'Tidak tertaut (`sso.not_linked`) / akun tanpa password (`sso.unlink_blocked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/webauthn:
    get:
      tags: [Auth]
      summary: Kunci keamanan / passkey milik saya
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnList'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/webauthn/register/begin:
    post:
      tags: [Auth]
      summary: Mulai mendaftarkan kunci keamanan (butuh password)
      description: |
        Mengembalikan opsi untuk `navigator.credentials.create()` (`options` = `PublicKeyCredentialCreationOptions` dengan
        field biner base64url) dan `ceremony_id` sekali pakai berumur 5 menit. Kunci yang sudah terdaftar dikecualikan.
        WebAuthn sebagai **faktor kedua**: `residentKey: discouraged`, `userVerification: preferred`, attestation `none`.
        RP ID = host `PUBLIC_BASE_URL` (atau `WEBAUTHN_RP_ID`); alamat IP tidak valid → 409 `webauthn.not_available`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
                name: {type: string, maxLength: 40, example: YubiKey kantor}
                passkey: {type: boolean, default: false, description: 'true = daftarkan sebagai PASSKEY untuk login tanpa password: resident key + verifikasi pengguna wajib, dan authenticator yang tidak melakukan UV ditolak. Butuh `passkey_login` menyala (409 `passkey.disabled`).'}
      responses:
        '200':
          description: Opsi + ceremony
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnBegin'}
        '401': {description: 'Password salah', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'WebAuthn tidak tersedia / batas 10 kunci', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: 'Nama terlalu panjang', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/webauthn/register/finish:
    post:
      tags: [Auth]
      summary: Selesaikan pendaftaran kunci keamanan
      description: |
        `credential` = hasil `navigator.credentials.create()` yang diserialisasi (`id`, `rawId`, `type`, `response.{clientDataJSON,attestationObject}`,
        semua biner base64url). Server memverifikasi challenge, origin, RP ID, flag, dan attestation. Bila ini faktor 2FA pertama,
        10 kode pemulihan diterbitkan (tampil sekali); jika tidak, `recovery_codes` kosong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ceremony_id, credential]
              properties:
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, additionalProperties: true}
      responses:
        '201':
          description: Terdaftar
          content:
            application/json:
              schema:
                type: object
                required: [credential, recovery_codes]
                properties:
                  credential: {$ref: '#/components/schemas/WebAuthnCredential'}
                  recovery_codes: {type: array, items: {type: string}, maxItems: 10}
        '400': {description: 'Upacara tidak valid/kedaluwarsa/terpakai (`webauthn.ceremony_invalid`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Kunci sudah terdaftar / batas 10 kunci', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: 'Verifikasi pendaftaran gagal', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/webauthn/credentials/{credentialId}:
    delete:
      tags: [Auth]
      summary: Hapus satu kunci keamanan (butuh password + kode)
      description: Kode = TOTP atau kode pemulihan. Menghapus kunci TERAKHIR tanpa TOTP berarti 2FA mati (kode pemulihan ikut dibuang).
      parameters:
        - {name: credentialId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaReauth'}
      responses:
        '204': {description: Dihapus}
        '401': {description: 'Password / kode salah', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login/webauthn/begin:
    post:
      tags: [Auth]
      security: []
      summary: Mulai login dengan kunci keamanan (setelah password benar)
      description: Memakai `mfa_token` dari `/auth/login`. `allowCredentials` hanya berisi kunci milik pengguna itu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: {type: string}
      responses:
        '200':
          description: Opsi + ceremony
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnBegin'}
        '401': {description: 'Token tantangan tidak valid (`auth.mfa_expired`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Tidak ada kunci (`webauthn.no_credentials`) / tidak tersedia', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '423': {description: 'Akun terkunci (`auth.locked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/login/webauthn/finish:
    post:
      tags: [Auth]
      security: []
      summary: Selesaikan login dengan kunci keamanan
      description: |
        `credential` = hasil `navigator.credentials.get()` (`id`, `rawId`, `type`, `response.{clientDataJSON,authenticatorData,signature,userHandle?}`).
        Upacara sekali pakai (juga bila gagal). Kegagalan dihitung seperti salah kode: 5 kali → akun terkunci 15 menit.
        Sign count yang mundur (indikasi kunci diklon) ditolak dan diaudit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, ceremony_id, credential]
              properties:
                mfa_token: {type: string}
                ceremony_id: {type: string, format: uuid}
                credential: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Cookie sesi di-set; badan = profil + `csrf_token`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400': {description: 'Upacara tidak valid/kedaluwarsa/terpakai', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '401': {description: 'Verifikasi gagal (`auth.webauthn_failed`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '423': {description: 'Akun terkunci (`auth.locked`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/2fa:
    get:
      tags: [Auth]
      summary: Status 2FA akun saya
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaStatus'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Mulai penyiapan 2FA (TOTP)
      description: Meminta password. Mengembalikan rahasia + URI `otpauth://` (render sebagai QR). 2FA belum aktif sampai `/auth/2fa/enable`. Memanggil ulang mengganti rahasia tertunda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        '200':
          description: Rahasia tampil di sini saja
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaSetup'}
        '401': {description: 'Password salah', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Sudah aktif (`mfa.already_enabled`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Konfirmasi kode pertama dan aktifkan 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, example: '123456'}
      responses:
        '200':
          description: 2FA aktif. 10 kode pemulihan tampil sekali.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '409': {description: 'Belum ada penyiapan (`mfa.no_pending_setup`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Kode salah, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Nonaktifkan 2FA (butuh password + kode)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaReauth'}
      responses:
        '204': {description: Dinonaktifkan}
        '401': {description: 'Password/kode salah', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Belum aktif (`mfa.not_enabled`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/2fa/recovery-codes:
    post:
      tags: [Auth]
      summary: Terbitkan ulang kode pemulihan (kode lama hangus)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaReauth'}
      responses:
        '200':
          description: 10 kode baru, tampil sekali
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '401': {description: 'Password/kode salah', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Belum aktif (`mfa.not_enabled`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204': {description: OK}
  /auth/me:
    get:
      tags: [Auth]
      summary: Profil + peran pengguna saat ini
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}

  /device-enrollments:
    post:
      tags: [Devices]
      summary: Buat token enrollment sekali pakai (untuk QR)
      description: Token berlaku 15 menit, sekali pakai, disimpan ter-hash. Dashboard merender `enroll_url` sebagai QR.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: {type: string, maxLength: 80}
                policy_id: {type: string, format: uuid}
                ttl_seconds: {type: integer, minimum: 60, maximum: 3600, default: 900}
      responses:
        '201':
          description: Dibuat. `token` hanya tampil sekali.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Enrollment'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /device-enrollments/{enrollmentId}:
    delete:
      tags: [Devices]
      summary: Cabut token enrollment yang belum dipakai
      parameters:
        - {name: enrollmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Dicabut}
        '404': {$ref: '#/components/responses/NotFound'}

  /devices:
    get:
      tags: [Devices]
      summary: Daftar device
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/DeviceStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Device'}}
                  next_cursor: {type: [string, 'null']}
  /devices/{deviceId}:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      tags: [Devices]
      summary: Detail device (termasuk SIM)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Devices]
      summary: Ubah nama, enable/disable, policy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 80}
                enabled: {type: boolean}
                policy_id: {type: [string, 'null'], format: uuid}
                tags: {type: array, items: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
    delete:
      tags: [Devices]
      summary: Cabut device (revoke kredensial, putus WebSocket kode 4401)
      description: Pesan `assigned`/`sending` milik device ini diproses sesuai aturan device-lost (lihat docs/03). Pesan `queued` tetap di antrean untuk SIM lain.
      responses:
        '204': {description: Dicabut}
  /devices/{deviceId}/commands:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [Devices]
      summary: Kirim perintah ke device via WebSocket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ping, refresh_sims, restart_service, upload_logs, rotate_credential]
      responses:
        '202':
          description: Perintah diterima. Hasil datang via event `device.command_result` di SSE.
          content:
            application/json:
              schema:
                type: object
                properties:
                  command_id: {type: string, format: uuid}
        '409':
          description: Device offline.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /device/enroll:
    post:
      tags: [DeviceAgent]
      security: []
      summary: Aplikasi menukar token QR menjadi kredensial device
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceEnrollRequest'}
      responses:
        '201':
          description: Berhasil. `device_secret` hanya dikirim sekali.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceEnrollResponse'}
        '401':
          description: Token tidak valid, kedaluwarsa, atau sudah dipakai.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /device/config:
    get:
      tags: [DeviceAgent]
      security: [{deviceToken: []}]
      summary: Ambil konfigurasi terbaru (fallback jika WebSocket belum tersambung)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceConfig'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /device/events:
    post:
      tags: [DeviceAgent]
      security: [{deviceToken: []}]
      summary: Kirim batch event status SMS via REST (fallback outbox flush)
      description: Idempoten berdasarkan `event_id`. Dipakai ketika WebSocket tidak tersedia atau saat flush outbox besar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 500
                  items: {$ref: '#/components/schemas/SmsEvent'}
      responses:
        '200':
          description: Daftar `event_id` yang sudah diterima (boleh dihapus dari outbox).
          content:
            application/json:
              schema:
                type: object
                properties:
                  acked: {type: array, items: {type: string, format: uuid}}

  /sims:
    get:
      tags: [SIMs]
      summary: Semua SIM lintas device
      parameters:
        - {name: device_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SimStatus'}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Sim'}}
  /sims/{simId}:
    parameters:
      - {name: simId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [SIMs]
      summary: Detail SIM + counter hari ini
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sim'}
    patch:
      tags: [SIMs]
      summary: Label, enable/disable, policy khusus SIM
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, maxLength: 80}
                enabled: {type: boolean}
                policy_id: {type: [string, 'null'], format: uuid}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sim'}

  /messages:
    get:
      tags: [Messages]
      summary: Daftar transaksi
      parameters:
        - {name: status, in: query, schema: {type: array, items: {$ref: '#/components/schemas/MessageStatus'}}, style: form, explode: false}
        - {name: source, in: query, schema: {$ref: '#/components/schemas/MessageSource'}}
        - {name: campaign_id, in: query, schema: {type: string, format: uuid}}
        - {name: device_id, in: query, schema: {type: string, format: uuid}}
        - {name: sim_id, in: query, schema: {type: string, format: uuid}}
        - {name: to, in: query, description: Prefix/exact E.164, schema: {type: string}}
        - {name: client_ref, in: query, schema: {type: string}}
        - {name: created_from, in: query, schema: {type: string, format: date-time}}
        - {name: created_to, in: query, schema: {type: string, format: date-time}}
        - {name: partial, in: query, description: 'true = hanya kegagalan parsial (termasuk yang semua bagiannya terkirim); false = selain itu.', schema: {type: boolean}}
        - {name: all_sent, in: query, description: 'true = hanya yang dinyatakan gagal tetapi SEMUA bagiannya terkirim; false = selain itu. Parsial sejati: `partial=true&all_sent=false`.', schema: {type: boolean}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Message'}}
                  next_cursor: {type: [string, 'null']}
    post:
      tags: [Messages]
      summary: Kirim SMS non-campaign (1..1000 penerima)
      description: |
        Dipakai oleh halaman "Kirim SMS" dan oleh sistem eksternal (API key).
        Pesan masuk antrean (`queued`) dan dikirim sesuai policy; respons tidak menunggu pengiriman.
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '202':
          description: Diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/Message'}}
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        to: {type: string}
                        reason: {type: string, enum: [invalid_number, suppressed, duplicate_client_ref, missing_variable]}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /messages/export:
    get:
      tags: [Messages]
      summary: Ekspor CSV dengan filter yang sama seperti daftar
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema: {type: string}
  /messages/{messageId}:
    parameters:
      - {$ref: '#/components/parameters/MessageId'}
    get:
      tags: [Messages]
      summary: Detail transaksi + timeline event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Message'
                  - type: object
                    properties:
                      events: {type: array, items: {$ref: '#/components/schemas/MessageEvent'}}
        '404': {$ref: '#/components/responses/NotFound'}
  /messages/{messageId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/MessageId'}
    post:
      tags: [Messages]
      summary: Batalkan pesan berstatus `queued` atau `assigned`
      responses:
        '200':
          description: Dibatalkan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '409':
          description: Sudah `sending` atau terminal, tidak bisa dibatalkan.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /messages/{messageId}/retry:
    parameters:
      - {$ref: '#/components/parameters/MessageId'}
    post:
      tags: [Messages]
      summary: Antrekan ulang pesan `failed`/`expired`/`unknown`
      description: Membuat attempt baru pada pesan yang sama. Untuk `unknown` dan kegagalan parsial (`partial=true`) operator harus mengonfirmasi risiko kirim ganda (`confirm_duplicate_risk=true`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_duplicate_risk: {type: boolean}
                sim_ids: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: Kembali ke `queued`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '409':
          description: Status tidak boleh di-retry
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /campaigns:
    get:
      tags: [Campaigns]
      summary: Daftar campaign (dengan counter)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CampaignStatus'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Campaign'}}
                  next_cursor: {type: [string, 'null']}
    post:
      tags: [Campaigns]
      summary: Buat campaign (status `draft`)
      description: |
        Wajib `name` dan salah satu dari `body`/`template_id`. Header `Idempotency-Key` yang sama (per pengguna) mengembalikan campaign yang sudah ada.
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignInput'}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /campaigns/{campaignId}:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    get:
      tags: [Campaigns]
      summary: Detail + counter + perkiraan selesai
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Ubah campaign. Penuh saat `draft`; saat `scheduled`/`running`/`paused` hanya `policy_id` dan `sim_ids`.
      description: Field yang tidak dikirim tidak berubah; `policy_id`/`description`/`schedule.start_at` bernilai `null` berarti dihapus. Perubahan policy/SIM berlaku untuk pesan campaign yang belum di-lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Field tidak boleh diubah pada status ini (`campaign.not_editable`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Campaigns]
      summary: Hapus campaign berstatus `draft` (beserta penerimanya)
      responses:
        '204': {description: Dihapus}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Bukan draft
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /campaigns/{campaignId}/recipients:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Impor penerima (hanya saat `draft`; boleh berulang, maks. 50.000 per campaign)
      description: |
        Nomor dinormalisasi ke E.164 dan **satu nomor hanya sekali per campaign** (duplikat dihitung, tidak disimpan; `dedupe=false` ditolak pada v1).
        Nomor di daftar blokir dilewati. Bila `body`/`template_id` sudah diisi, penerima yang kekurangan variabel template ditolak per baris.
        CSV: UTF-8 (BOM diterima), pemisah `,` atau `;` terdeteksi otomatis, kolom wajib `phone`; kolom `client_ref` dipetakan ke referensi; kolom lain menjadi variabel (sel kosong = variabel tidak ada).
        Nomor `row` pada `invalid` mengikuti nomor baris berkas (header = baris 1) atau indeks+1 untuk JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                dedupe: {type: boolean, default: true, description: 'Hanya `true` yang didukung.'}
                recipients:
                  type: array
                  maxItems: 50000
                  items: {$ref: '#/components/schemas/RecipientInput'}
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: 'CSV UTF-8 (maks. 20 MiB).'}
                dedupe: {type: boolean}
      responses:
        '200':
          description: Ringkasan validasi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Campaign bukan `draft` (`campaign.not_editable`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Campaigns]
      summary: Hapus semua penerima (hanya saat `draft`), mis. untuk impor ulang setelah memperbaiki CSV
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: {type: integer}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Campaign bukan `draft`
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /campaigns/{campaignId}/start:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Mulai (atau jadwalkan jika `schedule.start_at` di masa depan)
      description: |
        Validasi pra-start: ada penerima, isi pesan lengkap, semua variabel template terpenuhi untuk semua penerima, irisan jendela waktu tidak kosong,
        dan ada minimal satu SIM aktif yang sesuai `sim_ids` (`campaign.no_capacity`). Materialisasi pesan berjalan asinkron per batch (maks. 1.000/batch dan
        maks. 20.000 pesan antre sekaligus, sehingga campaign besar tidak membengkakkan antrean).
      responses:
        '200':
          description: Status menjadi `scheduled` atau `running`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Transisi tidak valid (`campaign.invalid_transition`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /campaigns/{campaignId}/pause:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Jeda. Pesan `queued` tertahan, yang sedang `sending` diselesaikan. (Pesan tetap tunduk pada TTL.)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Transisi tidak valid
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /campaigns/{campaignId}/resume:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Lanjutkan dari `paused`. Evaluasi auto-pause dimulai ulang dari saat ini.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Transisi tidak valid
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /campaigns/{campaignId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Batalkan. Semua pesan `queued` dan penerima yang belum dimaterialisasi menjadi `cancelled`; yang sudah di tangan HP diselesaikan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Transisi tidak valid
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /campaigns/{campaignId}/preview:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    post:
      tags: [Campaigns]
      summary: Render template untuk N penerima contoh + hitung segmen dan estimasi durasi
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sample: {type: integer, default: 3, minimum: 1, maximum: 20}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignPreview'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /auth/preferences:
    get:
      tags: [Auth]
      summary: Preferensi pengguna yang login
      description: Hanya sesi dashboard. `email_available` = server punya SMTP; bila false, notifikasi email tidak pernah dikirim apa pun preferensinya.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPrefs'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Auth]
      summary: Ubah preferensi (mis. matikan notifikasi email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_notifications]
              properties:
                email_notifications: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPrefs'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /notifications:
    get:
      tags: [Messages]
      summary: Notifikasi dalam aplikasi milik pengguna yang login (terbaru dulu)
      description: 'Hanya sesi dashboard. Jenis: `saved_view.shared` (tampilan dibagikan pengguna lain; data: view_id, name, owner) dan `saved_view.moderated` (tampilan berbagi milik Anda dihapus admin; data: view_id, name, by; juga dikirim lewat email bila SMTP aktif, preferensi mengizinkan, dan belum ada email sejenis ke alamat itu dalam 10 menit). Event SSE `notification.created` (tanpa muatan) memberi sinyal untuk refetch.'
      parameters:
        - {name: unread, in: query, schema: {type: boolean}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_count]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                  unread_count: {type: integer, description: 'Jumlah belum dibaca keseluruhan (bukan hanya yang ada di items).'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /notifications/read-all:
    post:
      tags: [Messages]
      summary: Tandai semua notifikasi milik sendiri sudah dibaca
      responses:
        '204': {description: Selesai}
  /notifications/{notificationId}/read:
    parameters:
      - {name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Messages]
      summary: Tandai satu notifikasi sudah dibaca (milik pengguna lain/tidak ada = 404)
      responses:
        '204': {description: Selesai}
        '404': {$ref: '#/components/responses/NotFound'}
  /saved-views:
    get:
      tags: [Messages]
      summary: Tampilan (filter) transaksi — milik sendiri lebih dulu, lalu yang dibagikan pengguna lain (`mine=false`)
      description: Hanya sesi dashboard; API key tidak memiliki tampilan (403). Tampilan orang lain yang dibagikan hanya-baca; pemiliknya diberi label bagian lokal email.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedView'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Messages]
      summary: Simpan tampilan baru (maksimal 20 per pengguna; nama unik tanpa membedakan huruf besar/kecil)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewInput'}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedView'}
        '409': {description: 'Nama sudah dipakai (`saved_view.duplicate`) / batas 20 tampilan (`saved_view.limit`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /saved-views/{viewId}:
    parameters:
      - {name: viewId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Messages]
      summary: Ganti nama, filter, dan/atau status berbagi tampilan milik sendiri (milik pengguna lain = 404, juga bila dibagikan)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedViewInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedView'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Nama sudah dipakai (`saved_view.duplicate`) / batas 20 tampilan (`saved_view.limit`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Messages]
      summary: Hapus tampilan milik sendiri; admin juga boleh menghapus tampilan BERBAGI milik orang lain (moderasi, diaudit `saved_view.moderate_delete`)
      responses:
        '204': {description: Dihapus}
        '404': {$ref: '#/components/responses/NotFound'}
  /templates:
    get:
      tags: [Templates]
      summary: Daftar template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Template'}}
    post:
      tags: [Templates]
      summary: Buat template
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateInput'}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /templates/{templateId}:
    parameters:
      - {name: templateId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Templates]
      summary: Detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
    put:
      tags: [Templates]
      summary: Ganti isi template
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Templates]
      summary: Hapus
      responses:
        '204': {description: Dihapus}

  /dispatch-policies:
    get:
      tags: [Policies]
      summary: Daftar policy pengiriman
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DispatchPolicy'}}
    post:
      tags: [Policies]
      summary: Buat policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchPolicyInput'}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchPolicy'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /dispatch-policies/{policyId}:
    parameters:
      - {name: policyId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Policies]
      summary: Detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchPolicy'}
    put:
      tags: [Policies]
      summary: Ubah. Perubahan di-push ke device (`config.update`) dan berlaku untuk pesan yang belum di-lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchPolicyInput'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchPolicy'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Policies]
      summary: Hapus (ditolak jika masih dipakai atau default)
      responses:
        '204': {description: Dihapus}
        '409':
          description: Masih dipakai
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /dispatch-policies/{policyId}/effective:
    get:
      tags: [Policies]
      summary: Simulasi policy efektif untuk kombinasi tertentu (debug)
      parameters:
        - {name: policyId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sim_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Nilai efektif hasil merge (view terhitung, tanpa id). global -> device -> sim, dengan policy terpilih sebagai preferensi.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchPolicyInput'}
  /settings/default-policy:
    put:
      tags: [Policies]
      summary: Tetapkan policy global default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id]
              properties:
                policy_id: {type: string, format: uuid}
      responses:
        '204': {description: OK}
        '404': {$ref: '#/components/responses/NotFound'}

  /settings/dispatch-pause:
    get:
      tags: [Policies]
      summary: Status kill switch global (pause semua pengiriman)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PauseState'}
    put:
      tags: [Policies]
      summary: Aktifkan/nonaktifkan kill switch. Saat aktif dispatcher tidak melepas pesan baru; yang sudah sending diselesaikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseState'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PauseState'}

  /suppressions:
    get:
      tags: [Compliance]
      summary: Daftar nomor yang diblokir (opt-out / blacklist)
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Suppression'}}
                  next_cursor: {type: [string, 'null']}
    post:
      tags: [Compliance]
      summary: Tambah nomor (bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numbers]
              properties:
                numbers: {type: array, items: {type: string}}
                reason: {type: string}
      responses:
        '201': {description: Ditambahkan}
  /suppressions/{suppressionId}:
    delete:
      tags: [Compliance]
      summary: Hapus dari daftar blokir
      parameters:
        - {name: suppressionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: OK}

  /api-keys:
    get:
      tags: [Admin]
      summary: Daftar API key (tanpa secret)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}
    post:
      tags: [Admin]
      summary: Buat API key. Secret hanya tampil sekali.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                scopes:
                  type: array
                  items: {type: string, enum: ['messages:send', 'messages:read', 'campaigns:read']}
                expires_at: {type: [string, 'null'], format: date-time}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      secret: {type: string, description: 'Format `smsc_live_<random>`'}
  /api-keys/{apiKeyId}/rotate:
    post:
      tags: [Admin]
      summary: Putar secret API key
      description: |
        Id, nama, scope tetap; secret baru tampil sekali. Secret lama tetap sah selama `grace_seconds` (default 0 = langsung mati,
        maks. 604800) agar klien sempat diganti tanpa downtime.
      parameters:
        - {name: apiKeyId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds: {type: integer, minimum: 0, maximum: 604800, default: 0}
      responses:
        '200':
          description: Secret baru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      secret: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api-keys/{apiKeyId}:
    delete:
      tags: [Admin]
      summary: Cabut
      parameters:
        - {name: apiKeyId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: OK}
  /users:
    get:
      tags: [Admin]
      summary: Daftar pengguna dashboard (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/UserItem'}}
    post:
      tags: [Admin]
      summary: Buat pengguna
      description: |
       **Kebijakan password baru** — 12–256 karakter, bukan password umum (daftar ±47 rb entri + variasi sepele seperti `Password123!` / `p@ssw0rd`), bukan pola monoton/berurutan/jalur keyboard/blok berulang, dan tidak memuat nama akun (bagian email sebelum `@`, ≥ 4 huruf). Pelanggaran → 422 dengan pesan berawalan `terlalu lemah`. Password lama tidak dicabut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/Role'}
                password: {type: string, format: password}
      responses:
        '201': {description: Dibuat}
        '409': {description: 'Email sudah terdaftar', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: 'Validasi, termasuk kebijakan password', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /users/{userId}:
    delete:
      tags: [Admin]
      summary: Hapus pengguna (harus sudah dinonaktifkan)
      description: |
        Dua langkah agar tidak tak sengaja: nonaktifkan dahulu (`PATCH disabled=true`). Sesi dan kode pemulihan ikut terhapus;
        `created_by` pada API key/webhook/campaign menjadi null (objeknya tetap ada); audit log tetap menyimpan email pelaku.
        Akun sendiri ditolak.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Dihapus}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Akun sendiri (`user.self_change`) atau belum dinonaktifkan (`user.must_disable_first`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    patch:
      tags: [Admin]
      summary: Ubah peran / nonaktifkan pengguna lain
      description: |
        Berlaku seketika (peran dibaca setiap request). Menonaktifkan mencabut semua sesi pengguna itu dan menolak login.
        Mengubah akun sendiri ditolak (`user.self_change`, 409) — itu sekaligus menjamin selalu ada admin aktif.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: {$ref: '#/components/schemas/Role'}
                disabled: {type: boolean}
      responses:
        '200':
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserItem'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Mengubah diri sendiri (`user.self_change`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /users/{userId}/password:
    post:
      tags: [Admin]
      summary: Admin menetapkan password baru untuk pengguna lain
      description: Semua sesi pengguna itu dicabut dan kunci akunnya direset. Untuk akun sendiri gunakan `/auth/password`. Password tidak dicatat di audit. **Kebijakan password baru** — 12–256 karakter, bukan password umum (daftar ±47 rb entri + variasi sepele seperti `Password123!` / `p@ssw0rd`), bukan pola monoton/berurutan/jalur keyboard/blok berulang, dan tidak memuat nama akun (bagian email sebelum `@`, ≥ 4 huruf). Pelanggaran → 422 dengan pesan berawalan `terlalu lemah`. Password lama tidak dicabut.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: {type: string, format: password, minLength: 12}
      responses:
        '204': {description: Diganti}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Akun sendiri (`user.self_change`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /users/{userId}/2fa:
    delete:
      tags: [Admin]
      summary: Reset 2FA pengguna (kehilangan authenticator)
      description: Menghapus rahasia TOTP + kode pemulihan dan mencabut semua sesi pengguna itu. Tercatat di audit.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Direset}
        '404': {$ref: '#/components/responses/NotFound'}
  /invitations:
    get:
      tags: [Admin]
      summary: Daftar undangan (200 terbaru; tanpa token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Invitation'}}
    post:
      tags: [Admin]
      summary: Buat undangan pengguna (tautan sekali pakai)
      description: |
        `invite_url` tampil sekali di respons ini; admin dapat membagikannya sendiri, atau meminta server mengirimnya lewat email (`send_email`).
        Isi email di outbox disimpan terenkripsi dan dibuang begitu terkirim/gagal/dibatalkan. Penerima menetapkan passwordnya sendiri.
        Undangan baru untuk email yang sama mencabut yang lama. Email yang sudah menjadi pengguna → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: '#/components/schemas/Role'}
                ttl_hours: {type: integer, minimum: 1, maximum: 720, default: 168}
                send_email: {type: boolean, default: false, description: 'Kirim tautan ke email penerima lewat SMTP (outbox + retry). Butuh SMTP terkonfigurasi, jika tidak 409 `email.not_configured`. Kegagalan email tidak membatalkan undangan; tautan tetap dapat dibagikan manual.'}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationCreated'}
        '409': {description: 'Email sudah terdaftar, atau `email.not_configured`', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /invitations/{invitationId}:
    delete:
      tags: [Admin]
      summary: Cabut undangan
      parameters:
        - {name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Dicabut}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Sudah dipakai atau dicabut (`invitation.not_pending`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /invitations/lookup:
    post:
      tags: [Auth]
      security: []
      summary: Periksa token undangan (halaman undangan, publik)
      description: Semua kegagalan (tak dikenal, kedaluwarsa, dicabut, sudah dipakai) menjawab seragam 404 `invitation.invalid`. Dibatasi laju seperti login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Undangan berlaku
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitationInfo'}
        '404': {description: 'Tidak valid (`invitation.invalid`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /invitations/accept:
    post:
      tags: [Auth]
      security: []
      summary: Terima undangan dan buat akun (publik)
      description: |
        Atomik: pengguna dibuat dan undangan ditandai terpakai dalam satu transaksi. Password < 12 karakter (422) atau email yang
        sudah terdaftar (409) tidak menghabiskan undangan. Tidak membuat sesi; pengguna lalu login seperti biasa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, format: password, minLength: 12}
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema:
                type: object
                required: [id, email, role]
                properties:
                  id: {type: string, format: uuid}
                  email: {type: string, format: email}
                  role: {$ref: '#/components/schemas/Role'}
        '404': {description: 'Tidak valid (`invitation.invalid`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '409': {description: 'Email sudah terdaftar', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /scim-tokens:
    get:
      tags: [Admin]
      summary: Daftar token SCIM aktif (tanpa nilai token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScimToken'}}
    post:
      tags: [Admin]
      summary: Buat token SCIM untuk IdP
      description: |
        Token (`smsc_scim_…`) tampil sekali; hanya hash yang disimpan. Hanya berlaku di `/scim/v2` (bukan REST ini), dan sebaliknya
        sesi/API key tidak berlaku di SCIM. SCIM harus diaktifkan di server (`SCIM_ENABLED=true`), jika tidak 409 `scim.not_enabled`.
        Profil SCIM yang didukung: `contracts/scim.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 60, example: okta-prod}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ScimToken'
                  - type: object
                    required: [token]
                    properties:
                      token: {type: string}
        '409': {description: 'SCIM belum diaktifkan (`scim.not_enabled`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /scim-groups:
    get:
      tags: [Admin]
      summary: Grup SCIM yang diterima dari IdP (ringkasan, 500 teratas)
      description: Nama grup → peran dipetakan oleh environment (`SCIM_ADMIN_GROUPS`/`SCIM_OPERATOR_GROUPS`/`SCIM_VIEWER_GROUPS`); `mapped_role` null = grup tidak memengaruhi peran.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, display_name, members]
                      properties:
                        id: {type: string, format: uuid}
                        display_name: {type: string}
                        members: {type: integer}
                        mapped_role: {type: [string, 'null'], enum: [viewer, operator, admin, null]}
  /scim-tokens/{tokenId}:
    delete:
      tags: [Admin]
      summary: Cabut token SCIM
      parameters:
        - {name: tokenId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Dicabut}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings/scim:
    get:
      tags: [Admin]
      summary: Konfigurasi SCIM yang aktif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScimSettings'}
  /settings/sso:
    get:
      tags: [Admin]
      summary: Konfigurasi SSO OIDC yang aktif (tanpa rahasia)
      description: Konfigurasi dari environment server (`OIDC_*`). `?probe=1` menguji discovery ke IdP.
      parameters:
        - {name: probe, in: query, required: false, schema: {type: string, enum: ['1']}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SSOView'}
  /settings/email:
    get:
      tags: [Admin]
      summary: Pengaturan SMTP yang sedang aktif (tanpa kredensial)
      description: Konfigurasi SMTP berasal dari environment server (`SMTP_*`); tidak dapat diubah lewat API.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailConfig'}
  /settings/email/test:
    post:
      tags: [Admin]
      summary: Kirim email uji (langsung, tanpa outbox)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: {type: string, format: email}
      responses:
        '200':
          description: Terkirim
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: {type: boolean}
        '409': {description: 'SMTP belum dikonfigurasi (`email.not_configured`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: 'Alamat tujuan tidak valid', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {description: 'Server SMTP menolak / tidak terjangkau (`email.send_failed`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /settings/security:
    get:
      tags: [Admin]
      summary: Kebijakan wajib-2FA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecuritySettings'}
    put:
      tags: [Admin]
      summary: Ubah kebijakan wajib-2FA (default `off`)
      description: |
        `off` = 2FA opsional (default). `admin` = semua admin wajib. `all` = semua pengguna wajib.
        Pengguna dalam cakupan yang belum punya 2FA tetap dapat login, tetapi semua endpoint selain akun
        (`/auth/me`, `/auth/logout`, `/auth/password`, `/auth/2fa`, `/auth/2fa/setup`, `/auth/2fa/enable`) membalas
        **403 `auth.mfa_setup_required`** sampai 2FA aktif. API key tidak terpengaruh.
        Admin yang sendiri belum memakai 2FA tidak boleh menyalakannya (409 `security.enroll_first`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                require_2fa: {type: string, enum: ['off', admin, all]}
                passkey_login: {type: boolean, description: 'Izinkan login tanpa password dengan passkey (default false). Passkey = kepemilikan perangkat + verifikasi pengguna, sehingga tidak ada langkah kedua; mematikannya menolak login dan pendaftaran passkey baru, kunci tersimpan tetap sah sebagai faktor kedua.'}
      responses:
        '200':
          description: Kebijakan baru
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecuritySettings'}
        '409': {description: 'Admin belum memakai 2FA (`security.enroll_first`)', content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /audit-logs:
    get:
      tags: [Admin]
      summary: Jejak audit tindakan admin
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}
                  next_cursor: {type: [string, 'null']}
  /webhooks:
    get:
      tags: [Webhooks]
      summary: Daftar webhook (tanpa secret)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Webhook'}}
    post:
      tags: [Webhooks]
      summary: Daftarkan webhook. `signing_secret` hanya tampil SEKALI pada respons ini.
      description: |
        Target HTTP(S) dipanggil server dengan `POST` JSON (lihat skema `WebhookEnvelope`). Header:
        `X-SMSC-Event`, `X-SMSC-Delivery` (uuid; **sama pada setiap percobaan ulang**, gunakan untuk dedup), `X-SMSC-Timestamp` (epoch detik),
        `X-SMSC-Signature: sha256=<hex>` = HMAC-SHA256(`signing_secret`, `timestamp + "." + body mentah`).
        Penerima wajib memverifikasi tanda tangan memakai perbandingan waktu-konstan dan menolak timestamp > 5 menit.
        Balas `2xx` (maks. 10 detik) untuk menandai berhasil. Selain itu dicoba ulang: 30 dtk, 2 mnt, 10 mnt, 1 jam, 6 jam; lalu ditandai `failed`
        (dapat dikirim ulang manual). Pengiriman *at-least-once*: event yang sama dapat tiba lebih dari sekali.
        Redirect tidak diikuti. Alamat loopback, link-local (termasuk metadata cloud), dan unspecified ditolak; jaringan privat/tailnet diizinkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: {type: string, format: uri}
                events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WebhookEvent'}}
                description: {type: string}
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookCreated'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /webhooks/{webhookId}:
    parameters:
      - {$ref: '#/components/parameters/WebhookId'}
    get:
      tags: [Webhooks]
      summary: Detail webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Webhooks]
      summary: Ubah url, events, enabled, atau description. Webhook nonaktif tidak menerima event baru; pengiriman tertunda menunggu sampai diaktifkan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri}
                events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/WebhookEvent'}}
                enabled: {type: boolean}
                description: {type: [string, 'null']}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Webhook'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Webhooks]
      summary: Hapus webhook beserta riwayat pengirimannya
      responses:
        '204': {description: Dihapus}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/{webhookId}/rotate-secret:
    parameters:
      - {$ref: '#/components/parameters/WebhookId'}
    post:
      tags: [Webhooks]
      summary: Putar secret penandatangan
      description: |
        Secret baru tampil sekali. Selama `grace_seconds` (default 86400, maks. 604800) setiap pengiriman membawa **dua**
        tanda tangan di `X-SMSC-Signature` (`sha256=<baru>,sha256=<lama>`); penerima menerima bila salah satu cocok, sehingga
        penerima bisa berganti secret kapan saja dalam masa itu tanpa kehilangan event.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds: {type: integer, minimum: 0, maximum: 604800, default: 86400}
      responses:
        '200':
          description: Secret baru
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookCreated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: Validasi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /webhooks/{webhookId}/test:
    parameters:
      - {$ref: '#/components/parameters/WebhookId'}
    post:
      tags: [Webhooks]
      summary: Kirim event uji `webhook.test` (tanpa memedulikan langganan event)
      responses:
        '202':
          description: Diantrekan. Hasilnya terlihat pada riwayat pengiriman.
          content:
            application/json:
              schema:
                type: object
                required: [delivery_id]
                properties:
                  delivery_id: {type: string, format: uuid}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/{webhookId}/deliveries:
    parameters:
      - {$ref: '#/components/parameters/WebhookId'}
    get:
      tags: [Webhooks]
      summary: Riwayat pengiriman (terbaru dulu)
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
                  next_cursor: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/NotFound'}
  /webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    parameters:
      - {$ref: '#/components/parameters/WebhookId'}
      - {name: deliveryId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Webhooks]
      summary: Kirim ulang pengiriman berstatus `failed` (percobaan dimulai dari nol)
      responses:
        '204': {description: Diantrekan}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Bukan berstatus failed (`webhook.not_retryable`)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /settings/retention:
    get:
      tags: [Admin]
      summary: Pengaturan retensi data + ringkasan eksekusi terakhir
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetentionSettings'}
    put:
      tags: [Admin]
      summary: Ubah retensi
      description: |
        `body_retention_days`: isi pesan (dan variabel/nomor mentah/client_ref penerima campaign yang sudah selesai) dibersihkan setelah N hari sejak pesan selesai;
        `0` = segera setelah selesai. Metadata (nomor E.164, status, waktu) dipertahankan. Pesan yang isinya sudah dibersihkan tidak dapat di-retry.
        `event_retention_days`: timeline event dihapus setelah N hari. Audit log tidak pernah dihapus otomatis.
        `invitation_retention_days` (opsional; bila tidak dikirim nilai saat ini dipertahankan; default 90): undangan yang sudah diterima/dicabut/kedaluwarsa dihapus setelah N hari sejak peristiwa itu. Undangan yang masih tertunda tidak pernah dihapus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body_retention_days, event_retention_days]
              properties:
                body_retention_days: {type: integer, minimum: 0, maximum: 3650}
                event_retention_days: {type: integer, minimum: 1, maximum: 3650}
                invitation_retention_days: {type: integer, minimum: 1, maximum: 3650}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetentionSettings'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /stats/overview:
    get:
      tags: [Stats]
      summary: Ringkasan dashboard
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: {type: object, properties: {online: {type: integer}, degraded: {type: integer}, offline: {type: integer}}}
                  sims_active: {type: integer}
                  queue_depth: {type: integer}
                  today:
                    type: object
                    properties:
                      accepted: {type: integer}
                      sent: {type: integer}
                      delivered: {type: integer}
                      failed: {type: integer}
                      partial: {type: integer, description: 'Bagian dari `failed`: gagal setelah sebagian bagian SMS terkirim.'}
                      all_sent: {type: integer, description: 'Bagian dari `partial`: pesan dinyatakan gagal tetapi SEMUA bagiannya dilaporkan terkirim. Parsial sejati = partial - all_sent.'}
                  success_rate_24h: {type: number}
  /stats/timeseries:
    get:
      tags: [Stats]
      summary: Deret waktu jumlah per status
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: bucket, in: query, schema: {type: string, enum: [minute, hour, day], default: hour}}
        - {name: campaign_id, in: query, schema: {type: string, format: uuid}}
        - {name: sim_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        t: {type: string, format: date-time}
                        sent: {type: integer}
                        delivered: {type: integer}
                        failed: {type: integer}
                        partial: {type: integer, description: 'Bagian dari `failed` (kegagalan parsial).'}
                        all_sent: {type: integer, description: 'Bagian dari `partial`: semua bagian ternyata terkirim.'}

  /events/stream:
    get:
      tags: [Realtime]
      summary: Server-Sent Events untuk dashboard
      description: |
        `text/event-stream`. Jenis event: `message.updated`, `campaign.updated`, `device.updated`, `sim.updated`, `device.command_result`.
        Setiap event memiliki `id` monoton; klien yang reconnect mengirim `Last-Event-ID` dan server me-replay hingga 5 menit terakhir. Di luar itu klien melakukan refetch.
      responses:
        '200':
          description: Stream
          content:
            text/event-stream:
              schema: {type: string}

  /healthz:
    get:
      tags: [Stats]
      security: []
      servers:
        - url: https://smsc.example-tailnet.ts.net
      summary: Liveness. `/readyz` memeriksa koneksi DB.
      responses:
        '200': {description: OK}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: smsc_session
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: smsc_live_*
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (device_secret)

  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    DeviceId: {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
    MessageId: {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    CampaignId: {name: campaignId, in: path, required: true, schema: {type: string, format: uuid}}
    WebhookId: {name: webhookId, in: path, required: true, schema: {type: string, format: uuid}}

  responses:
    Unauthorized:
      description: Tidak terautentikasi
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Peran tidak cukup
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Tidak ditemukan
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Validasi gagal
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Rate limit API
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    PauseState:
      type: object
      required: [paused]
      properties:
        paused: {type: boolean}

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, description: 'URI/slug kode error, mis. `campaign.invalid_transition`'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}

    Role: {type: string, enum: [admin, operator, viewer]}
    Me:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        tailscale_login: {type: [string, 'null'], description: Terisi jika diautentikasi lewat identity header Tailscale Serve.}
        mfa_enabled: {type: boolean, description: 2FA TOTP aktif untuk akun ini.}
        has_password: {type: boolean, description: 'false = akun SSO-saja (dibuat lewat penyediaan otomatis, tanpa password lokal).'}
        sso_linked: {type: boolean, description: 'Akun tertaut ke identitas SSO.'}
        sso_session: {type: boolean, description: 'Sesi ini dibuat lewat SSO (hanya pada /auth/me).'}
        mfa_setup_required: {type: boolean, description: 'Kebijakan mewajibkan 2FA untuk akun ini tetapi belum aktif: hanya endpoint akun yang terbuka (403 `auth.mfa_setup_required` selainnya).'}
        csrf_token: {type: string, description: 'Hanya pada login/verify/me untuk sesi sendiri.'}

    UserItem:
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          required: [disabled, created_at]
          properties:
            disabled: {type: boolean}
            created_at: {type: string, format: date-time}
            scim_managed: {type: boolean, description: 'Diprovisi/dikelola IdP lewat SCIM.'}
    Invitation:
      type: object
      required: [id, email, role, status, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        status: {type: string, enum: [pending, accepted, expired, revoked]}
        created_by: {type: [string, 'null'], description: 'Email pembuat (null bila akunnya sudah dihapus).'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        accepted_at: {type: [string, 'null'], format: date-time}
        email_status: {type: [string, 'null'], enum: [queued, sent, failed, cancelled, null], description: 'Status email undangan terakhir; null = email tidak diminta.'}
        email_error: {type: [string, 'null'], description: 'Alasan kegagalan terakhir (percobaan ulang / gagal final).'}
    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [token, invite_url]
          properties:
            token: {type: string, description: 'Tampil sekali. Hanya hash yang disimpan.'}
            invite_url: {type: string, description: 'PUBLIC_BASE_URL + /invite/<token>; bagikan ke penerima lewat jalur aman.'}
    InvitationInfo:
      type: object
      required: [email, role, expires_at]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
        expires_at: {type: string, format: date-time}
    ScimToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        created_by: {type: [string, 'null'], description: 'Email pembuat'}
    ScimSettings:
      type: object
      required: [enabled, allow_admin_role, adopt_existing, managed_users]
      properties:
        enabled: {type: boolean}
        base_url: {type: string, description: 'Isi di IdP sebagai SCIM connector base URL.'}
        default_role: {type: string}
        allow_admin_role: {type: boolean, description: 'SCIM boleh memberi/mengubah peran admin (default false).'}
        adopt_existing: {type: boolean, description: 'Pengguna lokal yang ada terlihat/dapat dikelola SCIM (default false).'}
        managed_users: {type: integer}
        groups: {type: integer, description: 'Jumlah grup SCIM yang diterima.'}
        group_roles: {type: object, additionalProperties: {type: string, enum: [viewer, operator, admin]}, description: 'Pemetaan nama grup (huruf kecil) → peran dari environment.'}
        reconcile_interval_seconds: {type: integer, description: 'Interval rekonsiliasi berkala (SCIM_RECONCILE_INTERVAL); 0 = hanya saat start.'}
        last_reconcile:
          type: object
          description: 'Rekonsiliasi terakhir (disimpan di database, bertahan melewati restart); kosong bila belum pernah berjalan.'
          required: [at, changed, runs]
          properties:
            at: {type: string, format: date-time}
            changed: {type: integer, description: 'Jumlah pengguna yang perannya dikoreksi pada run itu.'}
            runs: {type: integer, description: 'Jumlah run kumulatif.'}
            error: {type: string, description: 'Pesan error run terakhir bila gagal.'}
    SSOView:
      type: object
      required: [enabled, auto_provision, link_by_email, sync_roles, trust_idp_mfa, allowed_domains, linked_users]
      properties:
        enabled: {type: boolean}
        name: {type: string}
        issuer: {type: string}
        client_id: {type: string}
        redirect_url: {type: string, description: 'Daftarkan persis URL ini sebagai redirect URI di IdP.'}
        reachable: {type: boolean, description: 'Hanya dengan ?probe=1.'}
        reach_error: {type: string}
        auto_provision: {type: boolean}
        default_role: {type: string}
        link_by_email: {type: boolean}
        sync_roles: {type: boolean}
        trust_idp_mfa: {type: boolean, description: 'Sesi SSO memenuhi kewajiban 2FA.'}
        allowed_domains: {type: array, items: {type: string}}
        linked_users: {type: integer}
    EmailConfig:
      type: object
      required: [configured, auth_enabled]
      properties:
        configured: {type: boolean}
        host: {type: string}
        port: {type: integer}
        mode: {type: string, enum: [starttls, tls, none]}
        from: {type: string}
        auth_enabled: {type: boolean}
    SecuritySettings:
      type: object
      required: [require_2fa, passkey_login, users_missing_2fa]
      properties:
        require_2fa: {type: string, enum: ['off', admin, all]}
        passkey_login: {type: boolean}
        users_missing_2fa: {type: integer, description: 'Pengguna aktif dalam cakupan yang belum punya 2FA.'}
    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: {type: boolean, const: true}
        mfa_token: {type: string, description: 'Berlaku 5 menit; hanya untuk /auth/login/verify dan /auth/login/webauthn/*.'}
        expires_in: {type: integer}
        methods:
          type: array
          description: 'Faktor kedua yang tersedia untuk akun ini, urutan tampilan.'
          items: {type: string, enum: [webauthn, totp, recovery]}
    MfaStatus:
      type: object
      required: [enabled, totp_enabled, webauthn_credentials, recovery_codes_remaining]
      properties:
        enabled: {type: boolean, description: 'Faktor apa pun aktif (TOTP atau kunci keamanan).'}
        totp_enabled: {type: boolean}
        webauthn_credentials: {type: integer}
        enabled_at: {type: [string, 'null'], format: date-time}
        recovery_codes_remaining: {type: integer}
    WebAuthnCredential:
      type: object
      required: [id, name, created_at, backed_up, passkey, transports]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        backed_up: {type: boolean, description: 'Passkey tersinkron (BS), mis. iCloud / Google Password Manager.'}
        passkey: {type: boolean, description: 'Dapat dipakai untuk login tanpa password.'}
        transports: {type: array, items: {type: string}}
    WebAuthnList:
      type: object
      required: [enabled, credentials]
      properties:
        enabled: {type: boolean, description: 'false bila RP ID server tidak valid (mis. alamat IP).'}
        rp_id: {type: string}
        credentials: {type: array, items: {$ref: '#/components/schemas/WebAuthnCredential'}}
    WebAuthnBegin:
      type: object
      required: [ceremony_id, options]
      properties:
        ceremony_id: {type: string, format: uuid}
        options: {type: object, additionalProperties: true, description: 'PublicKeyCredentialCreationOptions / RequestOptions (di bawah kunci `publicKey`), field biner base64url.'}
    MfaSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: 'Base32, untuk input manual di aplikasi authenticator.'}
        otpauth_uri: {type: string}
    MfaReauth:
      type: object
      required: [password, code]
      properties:
        password: {type: string, format: password}
        code: {type: string, description: 'TOTP 6 digit atau kode pemulihan.'}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: {type: array, items: {type: string}, maxItems: 10, description: '10 kode saat faktor 2FA PERTAMA diaktifkan; array kosong bila 2FA sudah aktif dengan faktor lain (kode yang ada tetap dipakai).'}

    Enrollment:
      type: object
      required: [id, token, enroll_url, web_url, short_code, expires_at]
      properties:
        id: {type: string, format: uuid}
        token: {type: string, description: Hanya tampil sekali.}
        enroll_url: {type: string, example: 'smsc://enroll?s=https%3A%2F%2Fsmsc.example-tailnet.ts.net&t=ABCD1234'}
        web_url: {type: string, description: 'Fallback https yang membuka app lewat App Link / menampilkan kode manual.'}
        short_code: {type: string, description: 'Kode 8 karakter untuk input manual.'}
        expires_at: {type: string, format: date-time}

    DeviceEnrollRequest:
      type: object
      required: [token, install_id, device_info, sims]
      properties:
        token: {type: string, description: Token atau short_code.}
        install_id: {type: string, format: uuid, description: UUID acak per-instalasi untuk mencegah enroll ganda.}
        device_info:
          type: object
          required: [manufacturer, model, sdk_int, app_version]
          properties:
            manufacturer: {type: string}
            model: {type: string}
            android_version: {type: string, example: '13'}
            sdk_int: {type: integer, minimum: 29}
            app_version: {type: string}
        capabilities: {$ref: '#/components/schemas/DeviceCapabilities'}
        sims:
          type: array
          items: {$ref: '#/components/schemas/SimReport'}
    DeviceEnrollResponse:
      type: object
      required: [device_id, device_secret, ws_url, config]
      properties:
        device_id: {type: string, format: uuid}
        device_secret: {type: string}
        ws_url: {type: string, example: 'wss://smsc.example-tailnet.ts.net/ws/device'}
        config: {$ref: '#/components/schemas/DeviceConfig'}
    DeviceConfig:
      type: object
      required: [protocol_version, heartbeat_interval_sec, config_version]
      properties:
        protocol_version: {type: integer, const: 1}
        heartbeat_interval_sec: {type: integer, default: 30}
        ws_ping_interval_sec: {type: integer, default: 20}
        reconnect_backoff: {type: object, properties: {min_ms: {type: integer, default: 1000}, max_ms: {type: integer, default: 60000}}}
        guardrails:
          type: object
          description: Batas keras yang juga ditegakkan device sebagai pertahanan kedua.
          properties:
            min_gap_ms: {type: integer}
            max_per_minute: {type: [integer, 'null']}
            os_sms_guard: {type: object, properties: {max_per_window: {type: integer, default: 25}, window_sec: {type: integer, default: 1800}}}
        config_version: {type: integer}

    DeviceCapabilities:
      type: object
      properties:
        default_sms_app: {type: boolean}
        os_sms_limit_unlocked: {type: boolean}
        battery_optimization_ignored: {type: boolean}
        notifications_enabled: {type: boolean}
        restricted_settings_allowed: {type: boolean}
        tailscale_vpn_active: {type: boolean}

    DeviceStatus: {type: string, enum: [pending, online, degraded, offline, revoked]}
    Device:
      type: object
      required: [id, name, status, enabled, capabilities, tags, created_at, sims]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {$ref: '#/components/schemas/DeviceStatus'}
        status_reason: {type: [string, 'null'], example: 'low_battery'}
        enabled: {type: boolean}
        manufacturer: {type: string}
        model: {type: string}
        android_version: {type: string}
        sdk_int: {type: integer}
        app_version: {type: string}
        battery_level: {type: [integer, 'null']}
        charging: {type: [boolean, 'null']}
        network_type: {type: [string, 'null'], enum: [wifi, cellular, ethernet, none, null]}
        tailscale_ip: {type: [string, 'null']}
        capabilities: {$ref: '#/components/schemas/DeviceCapabilities'}
        policy_id: {type: [string, 'null'], format: uuid}
        tags: {type: array, items: {type: string}}
        last_seen_at: {type: [string, 'null'], format: date-time}
        connected_since: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        sims: {type: array, items: {$ref: '#/components/schemas/Sim'}}

    SimStatus: {type: string, enum: [active, no_service, absent, disabled]}
    SimReport:
      type: object
      required: [slot_index, subscription_id]
      properties:
        slot_index: {type: integer, minimum: 0, description: 'Identitas stabil SIM dalam device (0 = SIM 1).'}
        subscription_id: {type: [integer, 'null'], description: 'Android subscriptionId. Volatil, hanya hint; null bila belum dilaporkan.'}
        carrier_name: {type: [string, 'null']}
        display_name: {type: [string, 'null']}
        phone_number: {type: [string, 'null']}
        is_esim: {type: boolean}
        signal_level: {type: [integer, 'null'], minimum: 0, maximum: 4}
        registered: {type: [boolean, 'null'], description: 'null = belum dilaporkan device.'}
        roaming: {type: [boolean, 'null']}
    Sim:
      allOf:
        - $ref: '#/components/schemas/SimReport'
        - type: object
          required: [id, device_id, enabled, status, today]
          properties:
            id: {type: string, format: uuid}
            device_id: {type: string, format: uuid}
            label: {type: [string, 'null']}
            enabled: {type: boolean}
            status: {$ref: '#/components/schemas/SimStatus'}
            policy_id: {type: [string, 'null'], format: uuid}
            next_eligible_at: {type: [string, 'null'], format: date-time}
            today:
              type: object
              properties:
                sent: {type: integer}
                delivered: {type: integer}
                failed: {type: integer}
            last_seen_at: {type: [string, 'null'], format: date-time}

    MessageStatus:
      type: string
      enum: [queued, assigned, sending, sent, delivered, failed, cancelled, expired, unknown]
    MessageSource: {type: string, enum: [dashboard, api, campaign]}
    ErrorCode:
      type: string
      enum:
        - invalid_destination
        - short_code_blocked
        - permission_denied
        - radio_off
        - no_service
        - generic_failure
        - null_pdu
        - os_rate_limited
        - sim_unavailable
        - delivery_failed
        - ack_timeout
        - sent_timeout
        - device_lost
        - device_revoked
        - expired
        - suppressed
        - missing_variable
    Message:
      type: object
      required: [id, source, to, encoding, parts, status, attempt, max_attempts, priority, created_at, not_before, expires_at, partial]
      properties:
        id: {type: string, format: uuid}
        source: {$ref: '#/components/schemas/MessageSource'}
        campaign_id: {type: [string, 'null'], format: uuid}
        client_ref: {type: [string, 'null']}
        to: {type: string, description: E.164}
        body: {type: [string, 'null'], description: 'null setelah dibersihkan oleh retensi body.'}
        encoding: {type: string, enum: [gsm7, ucs2]}
        parts: {type: integer}
        status: {$ref: '#/components/schemas/MessageStatus'}
        attempt: {type: integer}
        max_attempts: {type: integer}
        error_code: {oneOf: [{$ref: '#/components/schemas/ErrorCode'}, {type: 'null'}]}
        error_detail: {type: [string, 'null']}
        priority: {type: integer, minimum: 0, maximum: 9}
        device_id: {type: [string, 'null'], format: uuid}
        sim_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        not_before: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        assigned_at: {type: [string, 'null'], format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        partial: {type: boolean, description: 'true bila pesan gagal setelah sebagian bagian SMS (multi-bagian) sudah terkirim. Retry membuat bagian itu ganda di penerima, sehingga wajib `confirm_duplicate_risk`.'}
        parts_sent: {type: [integer, 'null'], description: 'Jumlah bagian yang sudah terkirim saat gagal parsial; null bila bukan kegagalan parsial.'}
    UserPrefs:
      type: object
      required: [email_notifications, email_available]
      properties:
        email_notifications: {type: boolean, description: 'Kirim email untuk peristiwa penting (saat ini: tampilan berbagi Anda dimoderasi admin). Default true.'}
        email_available: {type: boolean}
    Notification:
      type: object
      required: [id, kind, data, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [saved_view.shared, saved_view.moderated]}
        data: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    TxFilter:
      type: object
      description: Filter daftar transaksi di dashboard (kunci sama dengan parameter URL halaman Transaksi). Divalidasi ketat.
      properties:
        status: {type: array, items: {$ref: '#/components/schemas/MessageStatus'}}
        source: {type: string, enum: ['', dashboard, api, campaign]}
        to: {type: string, pattern: '^[+0-9]{0,20}$'}
        since: {type: string, description: 'Waktu lokal browser, format YYYY-MM-DDTHH:MM atau kosong.'}
        partial: {type: string, enum: ['', partial, allsent], description: 'partial = parsial sejati; allsent = gagal tetapi semua bagian terkirim.'}
        campaign: {type: string, description: 'UUID campaign atau kosong.'}
    SavedViewInput:
      type: object
      required: [name, filter]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        filter: {$ref: '#/components/schemas/TxFilter'}
        shared: {type: boolean, description: 'Bagikan ke seluruh tim. POST: default false. PUT: kosong = pertahankan. Tampilan berbagi tidak boleh memuat `filter.to` (422): awalan nomor akan terlihat oleh viewer yang nomornya di-masking.'}
    SavedView:
      type: object
      required: [id, name, filter, shared, mine, owner, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        shared: {type: boolean}
        mine: {type: boolean, description: 'true bila milik pengguna yang membaca.'}
        owner: {type: string, description: 'Bagian lokal email pemilik (sebelum @); email penuh tidak diekspos.'}
        filter: {$ref: '#/components/schemas/TxFilter'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MessageEvent:
      type: object
      required: [id, attempt, type, at, actor]
      properties:
        id: {type: string, format: uuid}
        attempt: {type: integer}
        type: {type: string, enum: [created, queued, assigned, acked, sending, part_sent, sent, part_delivered, delivered, failed, requeued, cancelled, expired, marked_unknown, manual_retry, status_progress, parts_refreshed, stale_event]}
        at: {type: string, format: date-time}
        actor: {type: string, enum: [system, device, user, api]}
        sim_id: {type: [string, 'null'], format: uuid}
        error_code: {type: [string, 'null']}
        data: {type: object, additionalProperties: true}

    RecipientInput:
      type: object
      required: [to]
      properties:
        to: {type: string, example: '08123456789'}
        vars:
          type: object
          additionalProperties: {type: string}
        client_ref: {type: string, maxLength: 128}
    MessageCreate:
      type: object
      required: [recipients]
      description: Wajib salah satu dari `body` atau `template_id`.
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/RecipientInput'}
        body: {type: string, maxLength: 1600}
        template_id: {type: string, format: uuid}
        sim_ids: {type: array, items: {type: string, format: uuid}, description: 'Allow-list SIM. Kosong = semua SIM aktif.'}
        device_ids: {type: array, items: {type: string, format: uuid}}
        policy_id: {type: string, format: uuid}
        priority: {type: integer, minimum: 0, maximum: 9, default: 5}
        not_before: {type: string, format: date-time}
        ttl_seconds: {type: integer, minimum: 30}

    CampaignStatus: {type: string, enum: [draft, scheduled, running, paused, completed, cancelled]}
    CampaignInput:
      type: object
      description: 'POST: `name` + (`body` atau `template_id`) wajib. PATCH: semua field opsional.'
      properties:
        name: {type: string, maxLength: 120}
        description: {type: [string, 'null']}
        body: {type: [string, 'null'], maxLength: 1600, description: 'Salah satu dari body/template_id terisi; yang lain null.'}
        template_id: {type: [string, 'null'], format: uuid}
        sim_ids: {type: array, items: {type: string, format: uuid}}
        policy_id: {type: [string, 'null'], format: uuid}
        priority: {type: integer, minimum: 0, maximum: 9, default: 3}
        schedule:
          type: object
          properties:
            start_at: {type: [string, 'null'], format: date-time}
        auto_pause:
          type: object
          description: Hentikan otomatis jika terlalu banyak gagal.
          properties:
            enabled: {type: boolean, default: true}
            window: {type: integer, default: 50, description: Jumlah pesan terakhir yang dievaluasi.}
            max_failure_ratio: {type: number, minimum: 0, maximum: 1, default: 0.5}
    AutoPauseState:
      type: object
      required: [enabled, window, max_failure_ratio]
      properties:
        enabled: {type: boolean}
        window: {type: integer, description: Jumlah percobaan terakhir yang dievaluasi.}
        max_failure_ratio: {type: number, minimum: 0, maximum: 1}
    CampaignCounters:
      type: object
      description: 'Invarian: total = queued + in_flight + sent + delivered + failed + cancelled + expired + unknown.'
      required: [total, queued, in_flight, sent, delivered, failed, partial, all_sent, cancelled, expired, unknown]
      properties:
        total: {type: integer, description: Jumlah penerima.}
        queued: {type: integer, description: Pesan antre + penerima yang belum dimaterialisasi (kecuali campaign dibatalkan).}
        in_flight: {type: integer, description: 'assigned + sending.'}
        sent: {type: integer, description: 'Status `sent` (menunggu laporan delivery); `delivered` dihitung terpisah.'}
        delivered: {type: integer}
        failed: {type: integer}
        partial: {type: integer, description: 'BAGIAN dari `failed` (bukan tambahan, tidak masuk invarian): gagal setelah sebagian bagian SMS terkirim.'}
        all_sent: {type: integer, description: 'BAGIAN dari `partial` (bukan tambahan): gagal tetapi semua bagian terkirim. Parsial sejati = partial - all_sent.'}
        cancelled: {type: integer}
        expired: {type: integer}
        unknown: {type: integer}
    Campaign:
      allOf:
        - $ref: '#/components/schemas/CampaignInput'
        - type: object
          required: [id, name, status, counters, recipients, auto_pause, sim_ids, priority, schedule, created_at]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            sim_ids: {type: array, items: {type: string, format: uuid}}
            priority: {type: integer, minimum: 0, maximum: 9}
            schedule:
              type: object
              required: [start_at]
              properties:
                start_at: {type: [string, 'null'], format: date-time}
            auto_pause: {$ref: '#/components/schemas/AutoPauseState'}
            status: {$ref: '#/components/schemas/CampaignStatus'}
            pause_reason: {type: [string, 'null'], enum: [user, auto_failure_ratio, no_capacity, null]}
            counters: {$ref: '#/components/schemas/CampaignCounters'}
            recipients:
              type: object
              required: [count, columns]
              properties:
                count: {type: integer}
                columns: {type: array, items: {type: string}, description: 'Nama variabel yang tersedia (contoh dari 1.000 penerima pertama).'}
            estimated_finish_at: {type: [string, 'null'], format: date-time, description: 'Perkiraan kasar berdasar SIM online dan policy; abaikan jendela waktu.'}
            created_by: {type: [string, 'null'], format: uuid}
            created_at: {type: string, format: date-time}
            started_at: {type: [string, 'null'], format: date-time}
            finished_at: {type: [string, 'null'], format: date-time}
    ImportResult:
      type: object
      required: [accepted, duplicates, suppressed, invalid]
      properties:
        accepted: {type: integer}
        duplicates: {type: integer}
        suppressed: {type: integer}
        invalid:
          type: array
          items:
            type: object
            required: [row, value, reason]
            properties:
              row: {type: integer}
              value: {type: string}
              reason: {type: string, description: '`invalid_number` atau `missing_variable:<nama>`.'}
    CampaignPreview:
      type: object
      required: [samples, recipients, total_parts, online_sims, estimated_duration_seconds, missing_variables]
      properties:
        recipients: {type: integer}
        samples:
          type: array
          items:
            type: object
            required: [to, body, encoding, parts]
            properties:
              to: {type: string}
              body: {type: string}
              encoding: {type: string, enum: [gsm7, ucs2]}
              parts: {type: integer}
        total_parts: {type: integer, description: Perkiraan total segmen seluruh penerima (dari contoh).}
        online_sims: {type: integer, description: Jumlah SIM yang saat ini dapat mengirim untuk campaign ini.}
        estimated_duration_seconds: {type: [integer, 'null'], description: 'null bila tidak ada SIM online. Kasar: tidak memperhitungkan jendela waktu.'}
        missing_variables: {type: array, items: {type: object, required: [name, recipients], properties: {name: {type: string}, recipients: {type: integer}}}}

    TemplateInput:
      type: object
      required: [name, body]
      properties:
        name: {type: string}
        body: {type: string, maxLength: 1600, example: 'Halo {{name}}, tagihan {{amount}} jatuh tempo {{due}}.'}
    Template:
      allOf:
        - $ref: '#/components/schemas/TemplateInput'
        - type: object
          required: [id, name, body, variables, updated_at]
          properties:
            id: {type: string, format: uuid}
            variables: {type: array, items: {type: string}}
            updated_at: {type: string, format: date-time}

    SendWindow:
      type: object
      properties:
        timezone: {type: string, example: Asia/Jakarta}
        windows:
          type: array
          items:
            type: object
            required: [days, start, end]
            properties:
              days: {type: array, items: {type: integer, minimum: 1, maximum: 7}, description: 1=Senin .. 7=Minggu}
              start: {type: string, example: '08:00'}
              end: {type: string, example: '20:00'}
    DispatchPolicyInput:
      type: object
      required: [name]
      description: Field null/absen berarti "tidak diatur pada level ini" dan diwarisi dari level di atasnya.
      properties:
        name: {type: string}
        min_delay_ms: {type: [integer, 'null'], minimum: 0, description: Jeda minimum antar pengiriman pada SIM yang sama.}
        max_delay_ms: {type: [integer, 'null'], minimum: 0, description: 'Jeda maksimum. Jeda aktual = acak seragam [min,max].'}
        burst_size: {type: [integer, 'null'], minimum: 1, description: Setelah N pesan berturut-turut pada SIM, jeda panjang.}
        burst_pause_ms: {type: [integer, 'null'], minimum: 0}
        max_inflight_per_sim: {type: [integer, 'null'], minimum: 1, default: 1}
        rate_limits:
          type: object
          properties:
            per_minute: {type: [integer, 'null']}
            per_hour: {type: [integer, 'null']}
            per_day: {type: [integer, 'null']}
        send_window: {oneOf: [{$ref: '#/components/schemas/SendWindow'}, {type: 'null'}]}
        max_attempts: {type: [integer, 'null'], minimum: 1, maximum: 10}
        retry_backoff_ms: {type: [integer, 'null'], minimum: 1000}
        retry_backoff_max_ms: {type: [integer, 'null']}
        message_ttl_seconds: {type: [integer, 'null'], minimum: 30}
        track_delivery: {type: [boolean, 'null']}
        ack_timeout_ms: {type: [integer, 'null']}
        sent_timeout_ms: {type: [integer, 'null']}
        retry_on_unknown: {type: [boolean, 'null'], default: false}
    DispatchPolicy:
      allOf:
        - $ref: '#/components/schemas/DispatchPolicyInput'
        - type: object
          required: [id, is_default, updated_at]
          properties:
            id: {type: string, format: uuid}
            is_default: {type: boolean}
            updated_at: {type: string, format: date-time}

    Suppression:
      type: object
      required: [id, number, created_at]
      properties:
        id: {type: string, format: uuid}
        number: {type: string}
        reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}

    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string, description: 8 karakter pertama untuk identifikasi.}
        scopes: {type: array, items: {type: string}}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        rotated_at: {type: [string, 'null'], format: date-time}
        previous_valid_until: {type: [string, 'null'], format: date-time, description: 'Sampai kapan secret lama masih sah (null = sudah tidak).'}

    WebhookEvent:
      type: string
      enum: [message.sent, message.delivered, message.failed, campaign.completed, campaign.paused, device.offline]
    Webhook:
      type: object
      required: [id, url, events, enabled, created_at]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        events: {type: array, items: {$ref: '#/components/schemas/WebhookEvent'}}
        enabled: {type: boolean}
        description: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        secret_rotated_at: {type: [string, 'null'], format: date-time}
        previous_secret_valid_until: {type: [string, 'null'], format: date-time, description: 'Selama masa ini pengiriman membawa dua tanda tangan.'}
    WebhookCreated:
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [signing_secret]
          properties:
            signing_secret: {type: string, description: 'Format `whsec_...`. Tampil sekali; simpan di sisi penerima. Disimpan terenkripsi (AES-256-GCM) di server.'}
    WebhookDelivery:
      type: object
      required: [id, webhook_id, event, status, attempts, created_at]
      properties:
        id: {type: string, format: uuid, description: 'Sama dengan header X-SMSC-Delivery.'}
        webhook_id: {type: string, format: uuid}
        event: {type: string, description: 'Salah satu WebhookEvent atau `webhook.test`.'}
        status: {type: string, enum: [pending, delivered, failed]}
        attempts: {type: integer}
        last_status: {type: [integer, 'null'], description: 'Kode HTTP percobaan terakhir; null bila tidak ada respons.'}
        last_error: {type: [string, 'null']}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        failed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    WebhookEnvelope:
      type: object
      description: Isi body POST ke URL webhook (dokumentasi; bukan respons API).
      required: [event, delivery_id, at, data]
      properties:
        event: {type: string}
        delivery_id: {type: string, format: uuid}
        at: {type: string, format: date-time, description: Waktu event dibuat.}
        data:
          type: object
          description: |
            `message.*`: {message_id, client_ref, to, status, campaign_id, sim_id, device_id, attempt, error_code, created_at, sent_at, delivered_at}.
            `campaign.*`: {campaign_id, name, status, counters, reason?, at}. `device.offline`: {device_id, name, reason, at}. `webhook.test`: {message}.
            Isi SMS tidak pernah disertakan.
          additionalProperties: true
    RetentionRun:
      type: object
      required: [at, bodies_purged, events_deleted, recipients_scrubbed, sessions_deleted, enrollments_deleted, deliveries_deleted, invitations_deleted]
      properties:
        at: {type: string, format: date-time}
        bodies_purged: {type: integer}
        events_deleted: {type: integer}
        recipients_scrubbed: {type: integer}
        sessions_deleted: {type: integer}
        enrollments_deleted: {type: integer}
        deliveries_deleted: {type: integer}
        invitations_deleted: {type: integer}
    RetentionSettings:
      type: object
      required: [body_retention_days, event_retention_days, invitation_retention_days, last_run]
      properties:
        body_retention_days: {type: integer, minimum: 0, maximum: 3650}
        event_retention_days: {type: integer, minimum: 1, maximum: 3650}
        invitation_retention_days: {type: integer, minimum: 1, maximum: 3650}
        last_run: {oneOf: [{$ref: '#/components/schemas/RetentionRun'}, {type: 'null'}]}

    AuditLog:
      type: object
      required: [id, at, actor, action]
      properties:
        id: {type: string, format: uuid}
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string, example: device.revoke}
        target_type: {type: string}
        target_id: {type: string}
        data: {type: object, additionalProperties: true}

    SmsEvent:
      type: object
      required: [event_id, message_id, attempt, state, at]
      properties:
        event_id: {type: string, format: uuid, description: Kunci idempotensi.}
        message_id: {type: string, format: uuid}
        attempt: {type: integer}
        state: {type: string, enum: [sending, part_sent, sent, part_delivered, delivered, failed]}
        part_index: {type: [integer, 'null']}
        parts_total: {type: integer}
        error_code: {oneOf: [{$ref: '#/components/schemas/ErrorCode'}, {type: 'null'}]}
        android_result_code: {type: [integer, 'null'], description: 'Nilai mentah SmsManager.RESULT_ERROR_* untuk debugging.'}
        at: {type: string, format: date-time}
